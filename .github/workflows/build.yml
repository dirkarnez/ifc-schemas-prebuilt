name: build-schemas
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
      - 'c*'
      
permissions:
    contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    env:
      targetName: IFC4.x-development
      targetRef: ifc4.3-main
    defaults:
      run:
        shell: bash
    steps:
      # - shell: cmd
      #   run: git config --global core.autocrlf false
      
      - uses: actions/checkout@v6
        with:
          repository: "buildingSMART/${{ env.targetName }}"
          ref: ${{ env.targetRef }}
          path: ${{ env.targetName }}
          submodules: true
          fetch-depth: 0 # <-- clone with complete history

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13' # if too new, cannot build
          # check-latest: true

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y graphviz rsync unzip curl

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install "Cython<3" wheel setuptools
          python -m pip install --no-build-isolation "PyYAML==6.0"
          python -m pip install --no-build-isolation reversestem
          python -m pip install -r ${{ env.targetName }}/code/requirements.txt nltk
          python -m pip install typing_extensions lark
          
          # get a recent ifcopenshell 0.8 build with the latest ifcopenshell.mvd changes
          curl --silent --show-error --retry 5 -o /tmp/ifcopenshell_python.zip https://s3.amazonaws.com/ifcopenshell-builds/ifcopenshell-python-`python3 -c 'import sys;print("".join(map(str, sys.version_info[0:2])))'`-v0.8.6-f8da61b-linux64.zip
          mkdir -p `python3 -c 'import site; print(site.getusersitepackages())'`
          unzip -d `python3 -c 'import site; print(site.getusersitepackages())'` /tmp/ifcopenshell_python.zip
          rm /tmp/ifcopenshell_python.zip

      - working-directory: "${{ env.targetName }}/code"
        run: |
          pip install -r requirements.txt

      - name: Generate EXPRESS and XSD
        working-directory: "${{ env.targetName }}/code"
        shell: bash
        run: |
          set -euxo pipefail
          python -m generators.express ../schemas/ifc4x3_add2.uml \
            --output ../output/IFC.exp \
            --with-xsd \
            --xsd-output ../output/IFC.xsd

      - name: Generate property sets
        working-directory: "${{ env.targetName }}/code"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../output/psd
          python -m generators.pset ../schemas/ifc4x3_add2.uml --output ../output/psd

      - name: Generate bSDD export
        working-directory: "${{ env.targetName }}/code"
        shell: bash
        run: |
          set -euxo pipefail
          python -m generators.bsdd ../schemas/ifc4x3_add2.uml --output ../output/bsdd
          
      - name: Generate JSON schema structure
        working-directory: "${{ env.targetName }}/code"
        run: |
          set -euxo pipefail
          python -m generators.json ../schemas/ifc4x3_add2.uml ../output/psd --output ../output/structure.json
          
      - run: |
          ls -R
          
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          directory: "${{ env.targetName }}/output"
          filename: "${{ env.targetName }}-${{ github.ref_name }}.zip"
        
      - name: Release prebuilt
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.targetName }}/output/${{ env.targetName }}-${{ github.ref_name }}.zip"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
